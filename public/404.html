<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CineTrack</title>
  <script type="text/javascript">
    // Single Page App redirect for GitHub Pages
    // Preserves query string, hash, and route path
    var pathSegmentsToKeep = 1; // /CineTrack-web/
    var l = window.location;
    var currentPath = l.pathname;
    
    // Check if hosted under /CineTrack-web/
    var repoPrefix = '/CineTrack-web';
    var cleanPath = currentPath;
    if (cleanPath.indexOf(repoPrefix) === 0) {
      cleanPath = cleanPath.substring(repoPrefix.length);
    }
    
    // Redirect to base with path query
    var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      (currentPath.indexOf(repoPrefix) === 0 ? repoPrefix : '') + '/?' +
      'p=' + encodeURIComponent(cleanPath + l.search) +
      l.hash;
    
    l.replace(targetUrl);
  </script>
</head>
<body style="background-color: #070709; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Redirecting to CineTrack...</p>
</body>
</html>
